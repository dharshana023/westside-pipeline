[project]
name = "westside-pipeline"
version = "0.1.0"
description = "Westside product data pipeline — extract, transform, quality, load"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 110

[tool.coverage.run]
source = ["src/pipeline"]
