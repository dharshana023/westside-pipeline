# Databricks Asset Bundle (DAB) — the job, cluster, and schedule are defined here in
# version-controlled YAML instead of being clicked together in the Databricks UI.
# The SAME bundle deploys to dev/staging/prod; only the `targets` block changes.
#
# Deploy locally with the Databricks CLI:
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run westside_pipeline_job -t dev
bundle:
  name: westside_pipeline

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    build: python -m build
    path: ..

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: dev_catalog
      schedule_pause_status: PAUSED

  staging:
    mode: production
    variables:
      catalog: staging_catalog
      schedule_pause_status: UNPAUSED

  prod:
    mode: production
    variables:
      catalog: prod_catalog
      schedule_pause_status: UNPAUSED
    permissions:
      - level: CAN_MANAGE_RUN
        group_name: data-engineering

variables:
  catalog:
    description: Unity Catalog to write curated tables into for this environment
  schedule_pause_status:
    description: Schedule trigger state for this environment
